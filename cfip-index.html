const bits = bytesPerSecond * 8;

if (bits >= 1000 * 1000 * 1000) {

    return (
        (bits / (1000 * 1000 * 1000))
            .toFixed(2) +
        " Gbps"
    );

}

if (bits >= 1000 * 1000) {

    return (
        (bits / (1000 * 1000))
            .toFixed(2) +
        " Mbps"
    );

}

if (bits >= 1000) {

    return (
        (bits / 1000)
            .toFixed(2) +
        " Kbps"
    );

}

return bits.toFixed(0) + " bps";
}

/*

- 给速度增加颜色
*/
function speedClass(bytesPerSecond) {
const mbps =
bytesPerSecond * 8 / 1000 / 1000;
if (mbps >= 100) {
return "fast";
}
if (mbps >= 20) {
return "medium";
}
return "slow";
}

/*

- 安全的 URL
- 
- 如果输入的是：
- https://speed.example.com/file.bin
- 
- 实际测速时：
- https://1.2.3.4:443/file.bin
- 
- 保留 pathname、query。
*/
function buildTargetUrl(ip, port, speedUrl) {
let original;
try {
 original = new URL(speedUrl);
} catch (e) {
 throw new Error("测速地址不是有效 URL");
}
/*
  - 只允许 HTTP / HTTPS
*/
if (
original.protocol !== "http:" &&
original.protocol !== "https:"
) {
 throw new Error(
     "测速地址必须使用 HTTP 或 HTTPS"
 );
}
/*
  - IPv6 地址需要 []
*/
const host =
ip.includes(":")
? [${ip}]
: ip;
const url =
original.protocol +
"//" +
host +
":" +
port +
original.pathname +
original.search;
return url;
}

/* =====================================================
查询 IP 信息
===================================================== */

async function getIpInfo(ip) {

try {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            8000
        );


    const response =
        await fetch(
            "https://ipwho.is/" +
            encodeURIComponent(ip),
            {
                signal: controller.signal,
                cache: "no-store"
            }
        );


    clearTimeout(timer);


    if (!response.ok) {
        throw new Error("IP 信息查询失败");
    }


    const data =
        await response.json();


    if (!data.success) {

        return {
            asn: "-",
            org: "-",
            location: "-"
        };

    }


    return {

        asn:
            data.connection &&
            data.connection.asn
                ? "AS" +
                  data.connection.asn
                : "-",

        org:
            data.connection &&
            data.connection.org
                ? data.connection.org
                : "-",

        location:
            [
                data.country,
                data.region,
                data.city
            ]
            .filter(Boolean)
            .join(" / ") || "-"

    };

} catch (error) {

    return {

        asn: "-",
        org: "-",
        location: "-"

    };

}
}

/* =====================================================
测速
===================================================== */

async function measureSpeed(
ip,
port,
speedUrl,
timeoutSeconds
) {

const target =
    buildTargetUrl(
        ip,
        port,
        speedUrl
    );


/*
 * 增加随机参数，避免浏览器缓存。
 */

const separator =
    target.includes("?")
        ? "&"
        : "?";

const finalUrl =
    target +
    separator +
    "_speedtest=" +
    Date.now() +
    "_" +
    Math.random()
        .toString(36)
        .substring(2);


const controller =
    new AbortController();


const timeout =
    setTimeout(
        () => controller.abort(),
        timeoutSeconds * 1000
    );


const start =
    performance.now();


let bytes = 0;


try {

    const response =
        await fetch(
            finalUrl,
            {
                method: "GET",
                cache: "no-store",
                mode: "cors",
                signal: controller.signal
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    /*
     * 优先使用 ReadableStream，
     * 可以实时统计下载速度。
     */

    if (response.body) {

        const reader =
            response.body.getReader();


        while (true) {

            if (stopped) {

                try {
                    await reader.cancel();
                } catch (e) {}

                throw new Error(
                    "测速已停止"
                );

            }


            const {
                done,
                value
            } =
                await reader.read();


            if (done) {
                break;
            }


            if (value) {
                bytes += value.byteLength;
            }

        }

    } else {

        const buffer =
            await response.arrayBuffer();

        bytes =
            buffer.byteLength;

    }


    clearTimeout(timeout);


    const end =
        performance.now();


    const seconds =
        (end - start) / 1000;


    if (seconds <= 0) {

        throw new Error(
            "测速时间异常"
        );

    }


    const speed =
        bytes / seconds;


    return {

        success: true,

        bytes: bytes,

        seconds: seconds,

        speed: speed

    };

} catch (error) {

    clearTimeout(timeout);


    if (
        error.name === "AbortError"
    ) {

        throw new Error(
            "连接超时"
        );

    }


    throw error;

}
}

/* =====================================================
结果表
===================================================== */

function renderResults() {

const tbody =
    document.getElementById(
        "resultBody"
    );


const count =
    document.getElementById(
        "resultCount"
    );


count.textContent =
    results.length +
    " 个结果";


if (results.length === 0) {

    tbody.innerHTML = `
        <tr>
            <td colspan="6">
                <div class="empty">
                    暂无测速结果
                </div>
            </td>
        </tr>
    `;

    return;
}


tbody.innerHTML =
    results
        .map(item => {

            let speedHtml =
                "-";

            if (
                item.speed !== null &&
                item.speed !== undefined
            ) {

                speedHtml = `
                    <span class="speed ${speedClass(item.speed)}">
                        ${escapeHtml(
                            formatSpeed(item.speed)
                        )}
                    </span>
                `;

            }


            let statusHtml;

            if (
                item.status ===
                "testing"
            ) {

                statusHtml = `
                    <span class="loading">
                        测速中...
                    </span>
                `;

            } else if (
                item.status ===
                "success"
            ) {

                statusHtml = `
                    <span class="tag">
                        成功
                    </span>
                `;

            } else {

                statusHtml = `
                    <span class="error-text">
                        ${escapeHtml(
                            item.error ||
                            "失败"
                        )}
                    </span>
                `;

            }


            return `
                <tr>

                    <td class="ip-cell">
                        ${escapeHtml(
                            item.ip +
                            ":" +
                            item.port
                        )}
                    </td>

                    <td>
                        ${speedHtml}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.asn || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.org || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.location || "-"
                        )}
                    </td>

                    <td>
                        ${statusHtml}
                    </td>

                </tr>
            `;

        })
        .join("");
}

/* =====================================================
更新某个结果
===================================================== */

function updateResult(index, data) {

if (
    !results[index]
) {
    return;
}


Object.assign(
    results[index],
    data
);


renderResults();
}

/* =====================================================
开始测速
===================================================== */

async function startTest() {

if (!stopped) {

    /*
     * 防止重复启动
     */

    const button =
        document.getElementById(
            "startBtn"
        );

    if (
        button.disabled
    ) {
        return;
    }

}


stopped = false;


const speedUrl =
    document.getElementById(
        "speedUrl"
    )
    .value
    .trim();


const ipText =
    document.getElementById(
        "ipList"
    )
    .value
    .trim();


const defaultPort =
    Number(
        document.getElementById(
            "defaultPort"
        ).value
    );


const timeoutSeconds =
    Number(
        document.getElementById(
            "timeout"
        ).value
    );


if (!speedUrl) {

    showStatus(
        "请输入测速地址",
        "error"
    );

    return;
}


if (!ipText) {

    showStatus(
        "请输入至少一个 IP",
        "error"
    );

    return;
}


if (
    !Number.isInteger(defaultPort) ||
    defaultPort < 1 ||
    defaultPort > 65535
) {

    showStatus(
        "默认端口无效",
        "error"
    );

    return;
}


if (
    !Number.isFinite(timeoutSeconds) ||
    timeoutSeconds < 3
) {

    showStatus(
        "超时时间不能小于 3 秒",
        "error"
    );

    return;
}


/*
 * 检查 URL
 */

try {

    const url =
        new URL(speedUrl);

    if (
        url.protocol !== "http:" &&
        url.protocol !== "https:"
    ) {

        throw new Error();

    }

} catch (e) {

    showStatus(
        "测速地址无效，请输入 HTTP/HTTPS URL",
        "error"
    );

    return;
}


/*
 * 解析 IP
 */

const inputs =
    ipText
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);


const targets = [];


for (
    const input of inputs
) {

    const parsed =
        parseIpPort(
            input,
            defaultPort
        );


    if (!parsed) {
        continue;
    }


    targets.push(
        parsed
    );

}


if (targets.length === 0) {

    showStatus(
        "没有有效的 IP",
        "error"
    );

    return;
}


/*
 * 初始化结果
 */

results = targets.map(
    target => ({
        ip: target.ip,
        port: target.port,
        speed: null,
        asn: "-",
        org: "-",
        location: "-",
        status: "testing",
        error: ""
    })
);


renderResults();


/*
 * UI 状态
 */

document.getElementById(
    "startBtn"
).disabled = true;


document.getElementById(
    "stopBtn"
).disabled = false;


const progress =
    document.getElementById(
        "progress"
    );


progress.classList.add(
    "show"
);


updateProgress(
    0,
    targets.length
);


showStatus(
    "正在测速...",
    ""
);


/*
 * 逐个测速。
 *
 * 不一次性全部并发，
 * 避免浏览器连接过多。
 */

for (
    let i = 0;
    i < targets.length;
    i++
) {

    if (stopped) {
        break;
    }


    const target =
        targets[i];


    showStatus(
        `正在测试 ${target.ip}:${target.port} (${i + 1}/${targets.length})`,
        ""
    );


    /*
     * 同时查询 IP 信息。
     */

    const infoPromise =
        getIpInfo(
            target.ip
        );


    try {

        const speedResult =
            await measureSpeed(
                target.ip,
                target.port,
                speedUrl,
                timeoutSeconds
            );


        const info =
            await infoPromise;


        updateResult(
            i,
            {

                speed:
                    speedResult.speed,

                asn:
                    info.asn,

                org:
                    info.org,

                location:
                    info.location,

                status:
                    "success"

            }
        );

    } catch (error) {

        const info =
            await infoPromise;


        updateResult(
            i,
            {

                asn:
                    info.asn,

                org:
                    info.org,

                location:
                    info.location,

                status:
                    "error",

                error:
                    error.message ||
                    "测速失败"

            }
        );

    }


    updateProgress(
        i + 1,
        targets.length
    );

}


document.getElementById(
    "startBtn"
).disabled = false;


document.getElementById(
    "stopBtn"
).disabled = true;


if (stopped) {

    showStatus(
        "测速已停止",
        "error"
    );

} else {

    showStatus(
        "测速完成",
        "success"
    );

}
}

/* =====================================================
停止
===================================================== */

function stopTest() {

stopped = true;

showStatus(
    "正在停止...",
    "error"
);
}

/* =====================================================
清空
===================================================== */

function clearResults() {

stopped = true;

results = [];

renderResults();

updateProgress(
    0,
    0
);

document.getElementById(
    "status"
).classList.remove(
    "show"
);
}

/* =====================================================
状态提示
===================================================== */

function showStatus(
message,
type
) {

const status =
    document.getElementById(
        "status"
    );


status.textContent =
    message;


status.className =
    "status show";


if (type) {

    status.classList.add(
        type
    );

}
}

/* =====================================================
进度
===================================================== */

function updateProgress(
current,
total
) {

const bar =
    document.getElementById(
        "progressBar"
    );


if (
    !total ||
    total <= 0
) {

    bar.style.width =
        "0%";

    return;
}


const percent =
    Math.min(
        100,
        Math.round(
            current /
            total *
            100
        )
    );


bar.style.width =
    percent +
    "%";
}
