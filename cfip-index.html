/*

- 生成测试 URL
- 
- 注意：
- 这里保留用户填写的测速地址。
- 
- 例如：
- 
- https://speed.cloudflare.com/__down?bytes=10000000
- 
- 浏览器会直接访问这个测速地址。
*/
function createSpeedUrl(baseUrl) {
let url;
try {
url = new URL(baseUrl);
} catch (e) {
throw new Error("测速地址格式错误");
}
if (
url.protocol !== "http:" &&
url.protocol !== "https:"
) {
throw new Error(
"测速地址必须是 HTTP 或 HTTPS"
);
}
/*
  - 防止缓存
*/
url.searchParams.set(
"_speedtest",
Date.now().toString()
);
return url.toString();
}

/*

- 执行测速
- 
- 注意：
- 浏览器测速的是“测速 URL”的下载速度。
- 
- 浏览器无法直接建立任意 TCP socket。
*/
async function downloadTest(
url,
timeoutSeconds
) {
const controller =
new AbortController();
const timeout =
setTimeout(
() => controller.abort(),
timeoutSeconds * 1000
);
const start =
performance.now();
let bytes = 0;
try {
 const response =
     await fetch(
         url,
         {
             method: "GET",
             cache: "no-store",
             mode: "cors",
             signal: controller.signal
         }
     );


 if (!response.ok) {

     throw new Error(
         "HTTP " +
         response.status
     );

 }


 /*
  * 流式读取
  */
 if (response.body) {

     const reader =
         response.body.getReader();


     while (true) {

         if (stopFlag) {

             await reader.cancel();

             throw new Error(
                 "测速已停止"
             );

         }


         const result =
             await reader.read();


         if (result.done) {
             break;
         }


         if (result.value) {
             bytes +=
                 result.value.byteLength;
         }

     }

 } else {

     const buffer =
         await response.arrayBuffer();

     bytes =
         buffer.byteLength;

 }


 clearTimeout(timeout);


 const seconds =
     (performance.now() - start) /
     1000;


 return {
     bytes,
     seconds
 };
} catch (error) {
 clearTimeout(timeout);

 if (
     error.name === "AbortError"
 ) {

     throw new Error(
         "连接超时"
     );

 }

 throw error;
}

}

/*

- 更新进度条
*/
function updateProgress(
current,
total
) {
const bar =
document.getElementById(
"progressBar"
);
if (!total) {
 bar.style.width =
     "0%";

 return;
}
const percent =
Math.round(
current /
total *
100
);
bar.style.width =
percent + "%";
}

/*

- 添加结果行
*/
function addResult(
address,
info
) {

const tbody =
    document.getElementById(
        "results"
    );


/*
 * 第一次添加时删除“暂无结果”
 */
const empty =
    tbody.querySelector(".empty");

if (empty) {
    tbody.innerHTML = "";
}


const tr =
    document.createElement("tr");


tr.innerHTML = `
    <td class="ip">
        ${escapeHtml(address)}
    </td>

    <td class="speed">
        ${escapeHtml(info.speed)}
    </td>

    <td>
        ${escapeHtml(info.asn)}
    </td>

    <td>
        ${escapeHtml(info.org)}
    </td>

    <td>
        ${escapeHtml(info.location)}
    </td>

    <td class="${info.success ? "success" : "failed"}">
        ${escapeHtml(info.status)}
    </td>
`;


tbody.appendChild(tr);
}

/*

- 开始测速
*/
async function startTest() {
stopFlag = false;
const speedUrl =
document.getElementById(
"speedUrl"
).value.trim();
const ipText =
document.getElementById(
"ipList"
).value.trim();
const defaultPort =
Number(
document.getElementById(
"defaultPort"
).value
);
if (!speedUrl) {
 showStatus(
     "请输入测速地址",
     "error"
 );

 return;
}
if (!ipText) {
 showStatus(
     "请输入 IP",
     "error"
 );

 return;
}
if (
!Number.isInteger(defaultPort) ||
defaultPort < 1 ||
defaultPort > 65535
) {
 showStatus(
     "默认端口不正确",
     "error"
 );

 return;
}
/*
  - 验证测速 URL
*/
try {
createSpeedUrl(speedUrl);
} catch (e) {
 showStatus(
     e.message,
     "error"
 );

 return;
}
const lines =
ipText
.split(/\r?\n/)
.map(x => x.trim())
.filter(Boolean);
const targets = [];
for (const line of lines) {
 const target =
     parseAddress(
         line,
         defaultPort
     );


 if (target) {
     targets.push(target);
 }
}
if (!targets.length) {
 showStatus(
     "没有找到有效 IP",
     "error"
 );

 return;
}
/*
  - 清空之前结果
*/
document.getElementById(
"results"
).innerHTML = "";
document.getElementById(
"startBtn"
).disabled = true;
document.getElementById(
"stopBtn"
).disabled = false;
document.getElementById(
"progress"
).classList.add("show");
/*
  - 逐个测试
*/
for (
let i = 0;
i < targets.length;
i++
) {
if (stopFlag) {
break;
}
const target =
targets[i];
const address =
target.ip +
":" +
target.port;
showStatus(
"正在测试 " +
address +
" (" +
(i + 1) +
"/" +
targets.length +
")"
);
/*
    - 查询 ASN
*/
const infoPromise =
getIpInfo(
target.ip
);
let speed = "-";
let success = false;
let status = "失败";
try {
 /*
  * 当前浏览器版本：
  * 使用用户指定的测速地址。
  */
 const url =
     createSpeedUrl(
         speedUrl
     );


 const result =
     await downloadTest(
         url,
         15
     );


 speed =
     formatSpeed(
         result.bytes,
         result.seconds
     );
        success = true;
        status = "成功";


    } catch (error) {

        status =
            error.message ||
            "测速失败";

    }


    const ipInfo =
        await infoPromise;


    addResult(
        address,
        {

            speed,

            asn:
                ipInfo.asn,

            org:
                ipInfo.org,

            location:
                ipInfo.location,

            success,

            status

        }
    );


    updateProgress(
        i + 1,
        targets.length
    );

}


document.getElementById(
    "startBtn"
).disabled = false;


document.getElementById(
    "stopBtn"
).disabled = true;


if (stopFlag) {

    showStatus(
        "测速已停止",
        "error"
    );

} else {

    showStatus(
        "测速完成",
        "success"
    );

}
}

/*

- 停止测速
*/
function stopTest() {
stopFlag = true;
showStatus(
"正在停止...",
"error"
);

}

/*

- 清空
*/
function clearAll() {
stopFlag = true;
document.getElementById(
"results"
).innerHTML = <tr>
<td
colspan="6"
class="empty"
>
暂无结果
</td>
</tr>;
document.getElementById(
"progressBar"
).style.width = "0%";
document.getElementById(
"progress"
).classList.remove("show");
document.getElementById(
"status"
).className = "status";

}
