<!DOCTYPE html>
<script src="https://cdn.jsdelivr.net/npm/translate.js@latest"></script>
<script>
  translate.init({
    target: navigator.language.split('-')[0],  
    cache: true                                
  })
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 端口测速工具</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.container{max-width:1200px;margin:0 auto;padding:30px 16px}
.header{margin-bottom:24px}
.header h1{margin:0 0 8px;font-size:30px;color:#111827}
.header p{margin:0;color:#6b7280;font-size:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
.title{font-size:18px;font-weight:700;margin-bottom:18px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.form-item{margin-bottom:16px}
label{display:block;margin-bottom:7px;font-size:14px;font-weight:600;color:#374151}
input,textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:11px 13px;background:#fff;color:#111827;font-size:14px;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{height:180px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.primary{background:#2563eb;color:#fff}
.primary:hover{background:#1d4ed8}
.primary:disabled{background:#93c5fd;cursor:not-allowed}
.danger{background:#fee2e2;color:#b91c1c}
.danger:hover{background:#fecaca}
.secondary{background:#f3f4f6;color:#374151}
.secondary:hover{background:#e5e7eb}
.status{display:none;margin-top:15px;padding:11px 13px;border-radius:9px;font-size:13px;background:#f3f4f6;color:#4b5563}
.status.show{display:block}
.status.success{background:#ecfdf5;color:#047857}
.status.error{background:#fef2f2;color:#b91c1c}
.progress{display:none;height:6px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:15px}
.progress.show{display:block}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#60a5fa);transition:width .25s}
.result-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.count{font-size:13px;color:#6b7280}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;min-width:900px;border-collapse:collapse}
thead{background:#f9fafb}
th,td{padding:13px 12px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;white-space:nowrap}
th{font-weight:650;color:#4b5563}
.ip{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:700;color:#111827}
.speed{font-weight:700;color:#2563eb}
.fast{color:#059669}
.medium{color:#d97706}
.slow{color:#dc2626}
.success{color:#059669}
.failed{color:#dc2626}
.testing{color:#d97706}
.empty{text-align:center;color:#9ca3af;padding:45px 20px}
.tip{padding:13px 15px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:9px;font-size:13px;line-height:1.7;margin-bottom:20px}
.small{font-size:12px;color:#9ca3af;margin-top:7px}
@media(max-width:700px){
.container{padding:18px 10px}
.header h1{font-size:24px}
.card{padding:16px}
.grid{grid-template-columns:1fr}
.result-top{align-items:flex-start;gap:10px;flex-direction:column}
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>IP 端口测速工具</h1>
<p>输入 IP、端口和自定义测速地址，查看测速结果、ASN 和 IP 归属地。</p>
</div>

<div class="tip">
测速地址需要支持跨域访问（CORS）。浏览器本身不能直接建立任意 TCP/UDP 连接，因此纯前端版本的测速采用 HTTP/HTTPS 请求方式。
</div>

<div class="card">
<div class="title">测速配置</div>

<div class="form-item">
<label for="speedUrl">自定义测速地址</label>
<input id="speedUrl" type="text" value="https://speed.cloudflare.com/__down?bytes=10000000" placeholder="https://example.com/test.bin">
